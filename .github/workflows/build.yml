
name: Build Windows Portable Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Tesseract installation failed"
          }
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version

      - name: Build portable EXE
        shell: pwsh
        run: |
          ./build_windows.ps1

      - name: Upload portable program
        uses: actions/upload-artifact@v4
        with:
          name: ModakBossOverlay-Portable
          path: ModakBossOverlay_Windows_Portable.zip
          if-no-files-found: error
