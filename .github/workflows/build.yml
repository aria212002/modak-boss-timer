
name: Build Windows Portable Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss pillow pytesseract

      - name: Download Tesseract
        shell: pwsh
        run: |
          $url = "https://github.com/UB-Mannheim/tesseract/releases/latest"
          Write-Host "Tesseract installer reference: $url"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ModakBossOverlay modak_overlay.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ModakBossOverlay-Windows
          path: dist/ModakBossOverlay/
